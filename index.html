<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CP4 - Grid Layout</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main>
        <section class="secao-hero">
            <div class="container-hero">
                <div class="area-banner">
                    <img src="images/banner/01.jpg" alt="Foto principal de destaque">
                </div>
        
                <div class="area-texto">
                    <h2>CP4 - Grid Layout & Responsividade</h2>
                    <p>CP4 Front End 2026</p>
                    <a href="#" class="btn">Saiba mais</a>
                </div>
        
                <div class="area-galeria-mini">
                    <img src="images/sea/01.jpg" alt="Paisagem marítima 1">
                    <img src="images/sea/02.jpg" alt="Paisagem marítima 2">
                    <img src="images/sea/03.jpg" alt="Paisagem marítima 3">
                </div>
            </div>
        </section>
        <section class="secao-galeria">
            <div class="grid-galeria">
                <div class="card-foto"><img src="images/banner/01.jpg" alt="Foto 1"></div>
                <div class="card-foto"><img src="images/banner/02.jpg" alt="Foto 2"></div>
                <div class="card-foto"><img src="images/banner/03.jpg" alt="Foto 3"></div>
                <div class="card-foto"><img src="images/banner/04.jpg" alt="Foto 4"></div>
                <div class="card-foto"><img src="images/sea/01.jpg" alt="Foto 5"></div>
                <div class="card-foto"><img src="images/sea/02.jpg" alt="Foto 6"></div>
                <div class="card-foto"><img src="images/sea/03.jpg" alt="Foto 7"></div>
                <div class="card-foto"><img src="images/users/01.jpg" alt="Foto 8"></div>
                <div class="card-foto"><img src="images/users/02.jpg" alt="Foto 9"></div>
                <div class="card-foto"><img src="images/users/03.jpg" alt="Foto 10"></div>
            </div>
        </section>
    </main>
</body>
</html>
